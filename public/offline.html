<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Bangladesh Business Tycoon</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --accent: #006a4e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f0d;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --accent: #00a86b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 24rem; }
      .mark {
        width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
        background: linear-gradient(135deg, #006a4e 0%, #00895e 60%, #00a86b 100%);
        display: grid; place-items: center;
      }
      .disc { width: 28px; height: 28px; border-radius: 50%; background: #f42a41; }
      h1 { font-size: 1.15rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: var(--accent);
        border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
        min-height: 44px; width: 100%;
      }
      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><div class="disc"></div></div>
      <h1>You're offline</h1>
      <!--
        The world keeps running on the server while the player is disconnected,
        so the honest thing to say is that nothing was lost — not to pretend
        the game is paused.
      -->
      <p>
        Your shops keep trading on the server while you're away, so nothing has been lost.
        Reconnect and you'll get a summary of what happened.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
